global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'your-bot-token'
        chat_id: 0000000000
        api_url: 'https://api.telegram.org'
        message: '{{ template "telegram.message" . }}'
        send_resolved: true 

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

templates:
  - '/etc/alertmanager/*.tmpl' 
