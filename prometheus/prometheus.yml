global:
  scrape_interval: 5s

# Добавляем секцию alerting для Alertmanager

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Добавляем файл с правилами алертов
rule_files:
  - '/etc/prometheus/Redis.yml'
  - '/etc/prometheus/postgres.yml'
  - '/etc/prometheus/App.yml'
  - '/etc/prometheus/Frontend.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'Postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'Redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    
  - job_name: 'FastAPI'
    static_configs:
      - targets: ['backend:8005']

  - job_name: 'Docker_Metrics'
    static_configs:
      - targets: ['cadvisor:8080']

      
